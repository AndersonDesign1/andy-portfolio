name: Lint

on:
  push:
    paths:
      - "apps/web/**"
      - "apps/web-next/**"
      - "packages/**"
      - "tools/**"
      - "biome.jsonc"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/web-next/**"
      - "packages/**"
      - "tools/**"
      - "biome.jsonc"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/lint.yml"

jobs:
  lint:
    name: Lint web apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      # Oxlint/Oxfmt TypeScript configs require Node ^20.19 || >=22.18
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Covers apps/web (Ultracite Oxlint/Oxfmt + anti-slop) and
      # apps/web-next (Biome). Next is a workspace but is not deployed.
      - name: Lint workspaces
        run: bun run lint

      # Must go through the script, not `bunx biome`: bunx resolves a
      # separate Biome install that cannot resolve the ultracite presets.
      - name: Check root formatting
        run: bun run format:check

      - name: Typecheck Astro web
        run: bun run --filter=@andy-portfolio/web typecheck

      - name: Typecheck Next archive
        run: bun run --filter=@andy-portfolio/web-next typecheck

      - name: Build Next archive
        run: bun run --filter=@andy-portfolio/web-next build
