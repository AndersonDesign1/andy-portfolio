name: Lint

on:
  push:
    paths:
      - "apps/web/**"
  pull_request:
    paths:
      - "apps/web/**"

jobs:
  lint:
    name: Lint web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ultracite fix
        run: cd apps/web && bun run fix

      - name: Run biome fix
        run: cd apps/web && bun run lint:fix

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Linting found issues that were auto-fixed. Please commit the fixes."
            git status
            exit 1
          fi
