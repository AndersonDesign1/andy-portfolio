name: Lint

on:
  push:
    paths:
      - "apps/web/**"
      - "apps/web-next/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/web-next/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/lint.yml"

jobs:
  lint:
    name: Lint web apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint Astro web
        run: bun run --filter=@andy-portfolio/web lint

      - name: Typecheck Astro web
        run: bun run --filter=@andy-portfolio/web typecheck

      - name: Lint Next archive
        run: bun run --filter=@andy-portfolio/web-next lint
